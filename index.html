<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hibiki: guitar pedal designer</title>
<style>
  :root { --bg:#14161b; --panel:#1d2027; --line:#2e333d; --text:#d9dde6; --dim:#8b93a3; --acc:#f0a030; --in:#4da3ff; --out:#f0a030; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .logo { font-size: 16px; margin-right: 8px; color: var(--acc); }
  nav { margin-left: auto; display: flex; gap: 2px; }
  button, select, input { font: inherit; color: var(--text); background: #272b34; border: 1px solid var(--line); border-radius: 5px; padding: 4px 9px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on, button.primary { background: var(--acc); color: #111; border-color: var(--acc); font-weight: 600; }
  input[type=number] { width: 64px; }
  input[type=range] { padding: 0; accent-color: var(--acc); }
  main { flex: 1; min-height: 0; display: flex; }
  section { flex: 1; min-width: 0; min-height: 0; display: flex; }
  section[hidden] { display: none; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 10px; overflow: auto; }
  #palette { width: 104px; border-left: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
  #palette button { text-align: left; padding: 4px 7px; }
  #palette hr, aside hr { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 6px 0; }
  #side { width: 300px; }
  h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #sch { flex: 1; min-width: 0; background: #0f1115; touch-action: none; cursor: default; user-select: none; }
  .sym { fill: none; stroke: #cfd6e4; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .sel .sym { stroke: var(--acc); }
  .ghost { opacity: .55; pointer-events: none; }
  .hit { fill: transparent; }
  .pin { fill: #cfd6e4; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 0; width: min(1150px, 94vw); height: 86vh; }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  .bhead { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
  .bhead input { flex: 1; }
  #btags { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); max-height: 76px; overflow: auto; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 10px; }
  .tag small { color: var(--dim); }
  .tag.on small { color: #333; }
  #blist { flex: 1; overflow: auto; padding: 10px; }
  #blist.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; align-content: start; }
  .bitem { border: 1px solid var(--line); border-radius: 6px; padding: 8px; cursor: pointer; background: var(--bg); }
  .bitem:hover, .bitem:focus { border-color: var(--acc); outline: none; }
  .bitem svg { display: block; width: 100%; height: 170px; pointer-events: none; margin-bottom: 6px; }
  .bitem b { display: block; font-weight: 600; }
  .bitem i { white-space: nowrap; font-style: normal; font-size: 11px; color: var(--dim); margin-right: 7px; }
  #blist.list .bitem { display: flex; gap: 12px; align-items: baseline; padding: 5px 8px; margin-bottom: 4px; }
  #blist.list .bitem b { min-width: 330px; }
  .boxsel { fill: rgba(240, 160, 48, .08); stroke: var(--acc); stroke-dasharray: 4 3; }
  .pinhit { fill: transparent; cursor: crosshair; }
  .pinhit:hover { fill: rgba(240, 160, 48, .5); }
  .act rect { fill: #272b34; stroke: #4a5160; rx: 4; }
  .act:hover rect { fill: var(--acc); }
  .act text { fill: #d9dde6; font-size: 13px; text-anchor: middle; pointer-events: none; }
  .act:hover text { fill: #111; }
  .act { cursor: pointer; }
  .wire { stroke: #5fcf8f; stroke-width: 2; stroke-linecap: round; }
  .wire.sel { stroke: var(--acc); }
  .wirehit { stroke: transparent; stroke-width: 12; cursor: pointer; }
  .dot { fill: #5fcf8f; }
  .lab { fill: #aab3c5; font-size: 11px; pointer-events: none; }
  .dcv { fill: var(--acc); font-size: 10px; pointer-events: none; }
  .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .row > span:first-child { width: 74px; color: var(--dim); flex: none; }
  .row input:not([type=checkbox]), .row select { flex: 1; min-width: 0; }
  .hint { color: var(--dim); font-size: 12px; }
  #status { font-size: 12px; margin-top: 6px; }
  .bad { color: #ff7a6b; } .good { color: #6fcf97; }
  #scope { width: 100%; height: 150px; background: #0f1115; border: 1px solid var(--line); border-radius: 5px; display: block; }
  #tab-bench { flex-direction: column; padding: 10px; gap: 8px; overflow: auto; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .wrap { position: relative; }
  #tab-bench canvas { width: 100%; background: #0f1115; border: 1px solid var(--line); border-radius: 5px; display: block; }
  #ov { height: 140px; cursor: crosshair; } #zoom { height: 250px; } #spec { height: 210px; }
  #playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: #fff; display: none; pointer-events: none; }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin: 0 3px 0 10px; }
  .cin { background: var(--in); } .cout { background: var(--out); }
  #tab-board { flex-direction: row; }
  #boardwrap { flex: 1; min-width: 0; overflow: auto; background: #23262d; padding: 14px; }
  #board { display: block; user-select: none; touch-action: none; }
  #board text { font-family: system-ui, "Segoe UI", sans-serif; }
  #boardside { width: 330px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { border-bottom: 1px solid var(--line); padding: 2px 4px; text-align: left; vertical-align: top; }
  ul { margin: 4px 0; padding-left: 18px; }
  kbd { background: #2c313b; border-radius: 3px; padding: 0 4px; font: inherit; }
</style>
</head>
<body>
<header>
  <span class="logo">響 Hibiki</span>
  <select id="preset"><option value="">Examples…</option></select>
  <button id="new">New</button>
  <button id="open">Open…</button>
  <button id="save">Save</button>
  <button id="undo" title="Ctrl+Z">Undo</button>
  <button id="redo" title="Ctrl+Y">Redo</button>
  <button id="fit">Fit</button>
  <input type="file" id="file" accept=".json" hidden>
  <nav>
    <button data-tab="sch" class="on">Schematic</button>
    <button data-tab="bench">Test bench</button>
    <button data-tab="bread">Breadboard</button>
    <button data-tab="strip">Stripboard</button>
  </nav>
</header>
<main>
  <section id="tab-sch">
    <aside id="palette"></aside>
    <svg id="sch"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="0.8" cy="0.8" r="0.8" fill="#2a2f3a"/></pattern></defs><g id="view"></g></svg>
    <aside id="side">
      <div id="props"></div>
      <hr>
      <h3>Knobs</h3>
      <div id="knobs"></div>
      <hr>
      <h3>Live scope</h3>
      <canvas id="scope"></canvas>
      <div class="row"><span>Test tone</span><input id="freq" type="number" value="220" min="20" max="10000"> Hz <input id="amp" type="number" value="0.2" min="0.001" step="0.05"> V</div>
      <div class="row"><label><input type="checkbox" id="showdc" checked> Show DC voltages on the schematic</label></div>
      <div id="status"></div>
    </aside>
  </section>

  <section id="tab-bench" hidden>
    <div class="bar">
      <button id="loadAudio">Load audio file…</button><input type="file" id="audioFile" accept="audio/*" hidden>
      <button id="demo">Use demo riff</button>
      <span id="srcName" class="hint"></span>
    </div>
    <div class="bar">
      <label>Start <input id="t0" type="number" value="0" min="0" step="0.5"> s</label>
      <label>Length <input id="tlen" type="number" value="8" min="0.5" step="0.5"> s</label>
      <label>Guitar level <input id="peak" type="number" value="0.2" min="0.01" step="0.05"> V peak</label>
      <label>Oversampling <select id="os"><option>1</option><option selected>2</option><option>4</option></select></label>
      <button id="run" class="primary">Run through pedal</button>
      <progress id="prog" value="0" max="1"></progress>
      <span id="benchMsg" class="hint"></span>
    </div>
    <div class="bar">
      <button id="playDry">▶ Dry</button><button id="playWet">▶ Pedal</button><button id="stop">■ Stop</button>
      <label><input type="checkbox" id="match" checked> Match loudness</label>
      <button id="wav">Download pedal WAV</button>
      <span class="legend"><i class="cin"></i>input<i class="cout"></i>pedal output</span>
      <span class="hint">Drag on the overview to zoom, double-click to reset, wheel on the detail view to zoom.</span>
    </div>
    <div class="wrap"><canvas id="ov"></canvas><div id="playhead"></div></div>
    <canvas id="zoom"></canvas>
    <canvas id="spec"></canvas>
  </section>

  <section id="tab-board" hidden>
    <div id="boardwrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <aside id="boardside">
      <div class="bar" id="boardtools">
        <button data-mode="move" class="on">Move</button><button data-mode="wire">Add wire</button><button data-mode="cut">Cut</button><button data-mode="del">Delete wire</button>
      </div>
      <div class="bar" style="margin-top:6px"><button id="relayout">Auto layout</button><button id="pngout">Download PNG</button><button id="svgout">Download SVG</button></div>
      <hr>
      <h3>Check against schematic</h3>
      <div id="boardstatus"></div>
      <hr>
      <h3>Notes</h3>
      <div id="boardnotes" class="hint"></div>
      <hr>
      <h3>Parts</h3>
      <div id="bom"></div>
    </aside>
  </section>
</main>
<dialog id="blockdlg">
  <div class="bhead">
    <input id="bsearch" type="search" placeholder="Search blocks by name: muff, fender, clipper, compressor...">
    <button data-view="grid" title="Show a drawing of each block">Previews</button><button data-view="list" title="Names and tags only">List</button>
    <button id="bclose" title="Close (Esc)">✕</button>
  </div>
  <div id="btags"></div>
  <div id="blist"></div>
</dialog>
<script src="sim.js"></script>
<script src="schem.js"></script>
<script src="layout.js"></script>
<script src="pedals.js"></script>
<script src="presets.js"></script>
<script src="app.js"></script>
</body>
</html>
